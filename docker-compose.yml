services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_NAVER_MAPS_KEY_ID: ${VITE_NAVER_MAPS_KEY_ID:-}
        VITE_WEBRTC_ICE_SERVERS: ${VITE_WEBRTC_ICE_SERVERS:-}
    container_name: wedding-invitation
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 7860
      HOST: 0.0.0.0
      APP_ORIGIN: ${APP_ORIGIN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      DB_DRIVER: ${DB_DRIVER:-better-sqlite3}
      DB_PATH: ${DB_PATH:-/app/data/db/wedding.db}
      UPLOAD_ROOT: ${UPLOAD_ROOT:-/app/data/uploads}
      FRONTEND_DIST_DIR: /app/public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
    volumes:
      - ./data:/app/data
    ports:
      - "${FRONTEND_PORT:-8081}:7860"
