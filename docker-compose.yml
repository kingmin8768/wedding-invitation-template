services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wedding-invitation-backend
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      APP_ORIGIN: ${APP_ORIGIN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-${APP_ORIGIN}}
      DB_DRIVER: ${DB_DRIVER:-better-sqlite3}
      DB_PATH: ${DB_PATH:-/app/data/wedding.db}
      UPLOAD_ROOT: ${UPLOAD_ROOT:-/app/uploads}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ./data/db:/app/data
      - ./data/uploads:/app/uploads
    expose:
      - "3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_NAVER_MAPS_KEY_ID: ${VITE_NAVER_MAPS_KEY_ID:-}
    container_name: wedding-invitation-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      - backend
